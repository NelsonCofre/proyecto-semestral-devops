name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test y build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Test backend ventas
        working-directory: backend-ventas
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test -B

      - name: Test backend despachos
        working-directory: backend-despachos
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test -B

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validar Dockerfiles (build sin push)
        run: |
          docker build -t frontend:ci ./frontend
          docker build -t backend-ventas:ci ./backend-ventas
          docker build -t backend-despachos:ci ./backend-despachos

      - name: Nota CD automatico
        if: github.ref == 'refs/heads/deploy'
        run: |
          echo "CI completado en GitHub Actions."
          echo "CD automatico: CodeBuild webhook en push a deploy (build -> ECR -> EKS)."
          echo "Respaldo manual: bash scripts/deploy-cloudshell.sh en CloudShell."
