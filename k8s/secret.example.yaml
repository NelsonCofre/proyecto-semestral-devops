# Plantilla de referencia — NO aplicar con credenciales reales en Git.
# Crear el secret desde CloudShell con kubectl create secret (ver README).
#
# kubectl create secret generic db-credentials \
#   --namespace despachos-prod \
#   --from-literal=DB_ENDPOINT=TU_RDS_ENDPOINT \
#   --from-literal=DB_USERNAME=TU_USUARIO \
#   --from-literal=DB_PASSWORD=TU_PASSWORD

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: despachos-prod
type: Opaque
stringData:
  DB_ENDPOINT: REPLACE_RDS_ENDPOINT
  DB_USERNAME: REPLACE_DB_USERNAME
  DB_PASSWORD: REPLACE_DB_PASSWORD
